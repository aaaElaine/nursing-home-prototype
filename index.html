<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家床派单系统 · 高保真原型</title>
<style>
  :root{--primary:#ff7a45;--primary2:#e8502a;--dark:#23262e;--text:#333;--muted:#6b7280;--border:#e5e7eb;--bg:#f5f6f8;--card:#fff;--green:#2bb3a3;--red:#dc2626;--blue:#4f83cc;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;}
  button{font-family:inherit;font-size:15px;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:15px;}
  .grad{background:linear-gradient(135deg,#ff7a45,#e8502a);}
  .btn{border:none;border-radius:24px;padding:12px 20px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff7a45,#e8502a);}
  .btn.teal{background:linear-gradient(135deg,#33c3b3,#1f9c8d);}
  .btn.line{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  .btn.teal-line{background:#fff;color:var(--green);border:1px solid var(--green);}
  .btn.gray{background:#f3f4f6;color:var(--muted);border:1px solid var(--border);}
  .btn:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed;}
  .btn.sm{padding:6px 14px;font-size:14px;border-radius:8px;}
  .btn.full{width:100%;}
  .topbar{background:var(--dark);color:#fff;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;}
  .topbar .brand{font-size:16px;font-weight:700;}
  .topbar .brand span{color:var(--primary);}
  .switch{display:flex;gap:8px;}
  .switch button{background:transparent;color:#d1d5db;border:1px solid #4b5563;padding:6px 16px;border-radius:8px;font-size:14px;}
  .switch button.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}
  .phone{max-width:420px;margin:0 auto;min-height:calc(100vh - 54px);background:#fff;position:relative;padding-bottom:74px;}
  .nav{display:flex;align-items:center;justify-content:center;position:relative;height:48px;border-bottom:1px solid var(--border);font-size:17px;font-weight:700;color:var(--dark);}
  .nav .back{position:absolute;left:12px;color:var(--dark);font-size:22px;cursor:pointer;background:none;border:none;}
  .phone .body{padding:14px 16px;}
  .bottombar{position:fixed;bottom:0;left:0;right:0;max-width:420px;margin:0 auto;background:#fff;border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;z-index:30;}
  .bottombar .btn{flex:1;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f3f4f6;gap:12px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:var(--muted);font-size:14px;flex:none;}
  .row .v{color:var(--dark);font-weight:500;text-align:right;}
  .tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;}
  .tag.orange{background:#fff7f2;color:var(--primary);}
  .tag.green{background:#e6f7f5;color:var(--green);}
  .tag.red{background:#fef2f2;color:var(--red);}
  .tag.gray{background:#f3f4f6;color:var(--muted);}
  .tag.blue{background:#eef6ff;color:var(--blue);}
  .svc{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;align-items:center;cursor:pointer;}
  .svc:hover{border-color:var(--primary);}
  .svc .thumb{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#ffd9c7,#ffb08a);flex:none;}
  .svc .t{font-size:16px;font-weight:700;color:var(--dark);}
  .svc .d{font-size:13px;color:var(--muted);margin-top:2px;}
  .svc .p{color:var(--primary);font-weight:700;margin-left:auto;white-space:nowrap;}
  .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#9a3412;}
  .flow .step{background:#fff2e8;border-radius:8px;padding:5px 9px;}
  .flow .arrow{color:var(--primary);}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:14px;color:var(--dark);margin-bottom:4px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tabs{display:flex;gap:16px;border-bottom:1px solid var(--border);margin-bottom:12px;}
  .tabs div{padding:8px 0;color:var(--muted);cursor:pointer;font-weight:600;}
  .tabs div.active{color:var(--primary);border-bottom:2px solid var(--primary);}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;}
  .chips .chip{padding:6px 14px;border-radius:999px;background:#f3f4f6;color:var(--muted);white-space:nowrap;cursor:pointer;font-size:14px;}
  .chips .chip.active{background:#fff2e8;color:var(--primary);font-weight:600;}
  .hero{background:linear-gradient(135deg,#ff7a45,#e8502a);color:#fff;border-radius:14px;padding:18px;margin-bottom:14px;}
  .hero .big{font-size:22px;font-weight:800;line-height:1.4;}
  .hero .sub{font-size:13px;color:#ffe3d5;margin-top:6px;}
  .upload{width:74px;height:74px;border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;background:#fafafa;}
  .proof{width:74px;height:74px;border-radius:10px;background:linear-gradient(135deg,#eef2ff,#dbeafe);display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px;}
  table{width:100%;border-collapse:collapse;}
  th,td{border:1px solid var(--border);padding:8px 10px;text-align:center;font-size:13px;}
  th{background:#fde8e0;color:var(--dark);font-weight:600;}
  .timeline{display:flex;justify-content:space-between;margin:10px 0 4px;}
  .timeline .node{flex:1;text-align:center;position:relative;}
  .timeline .dot{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:14px;}
  .timeline .lbl{font-size:13px;color:var(--dark);}
  .timeline .tm{font-size:12px;color:var(--muted);}
  /* ===== 弹窗（对齐设计：底部抽屉 / 居中卡片，右上角 X，居中标题，底部按钮） ===== */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .overlay.show{display:flex;}
  .overlay.center{align-items:center;}
  .sheet{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px 26px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;position:relative;}
  .dialog{background:#fff;border-radius:20px;padding:24px 22px;width:322px;max-width:88vw;position:relative;}
  .sheet .head,.dialog .head{text-align:center;font-size:20px;font-weight:800;color:var(--dark);margin-bottom:18px;}
  .x{position:absolute;top:18px;right:18px;width:28px;height:28px;border-radius:50%;background:#e5e7eb;color:#6b7280;border:none;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .foot{display:flex;gap:12px;margin-top:20px;}
  .foot .btn{flex:1;}
  .radio{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f3f4f6;cursor:pointer;}
  .radio:last-child{border-bottom:none;}
  .radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid #d1d5db;flex:none;}
  .radio.on .dot{border-color:var(--green);background:radial-gradient(circle,#fff 0 30%,var(--green) 32% 100%);}
  .task-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f3f4f6;}
  .task-line:last-child{border-bottom:none;}
  .task-line .name{font-weight:600;color:var(--dark);font-size:15px;}
  .task-line .desc{font-size:13px;color:var(--muted);}
  .ok{background:#e6f7f5;color:var(--green);border-radius:10px;padding:11px 14px;font-size:14px;margin:10px 0;}
  .notice{background:#fff8f3;border:1px solid #fed7aa;border-radius:12px;padding:12px 14px;color:var(--primary);font-size:14px;margin-bottom:12px;}
  .pwd{display:flex;gap:10px;justify-content:center;margin:16px 0;}
  .pwd span{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:#f3f4f6;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:12px;overflow:hidden;margin-top:6px;}
  .keypad button{background:#fff;border:none;padding:15px;font-size:19px;color:var(--dark);}
  .admin-main{padding:22px;}
  .admin-main table th,.admin-main table td{text-align:left;font-size:14px;padding:10px 13px;border-color:var(--border);}
  .admin-main table{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;}
  /* ===== 平台端（网页端）：居中模态弹窗 + 网页按钮，配色沿用平台端橙色 ===== */
  .wmodal{background:#fff;border-radius:12px;width:520px;max-width:92vw;max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.18);}
  .wm-head{padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700;color:var(--dark);display:flex;justify-content:space-between;align-items:center;}
  .wm-x{border:none;background:none;font-size:15px;color:var(--muted);cursor:pointer;line-height:1;}
  .wm-body{padding:20px;}
  .wm-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .wbtn{border:none;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#ff7a45,#e8502a);color:#fff;}
  .wbtn.line{background:#fff;color:var(--dark);border:1px solid var(--border);}
  .wbtn.sm{padding:6px 14px;font-size:13px;border-radius:6px;}
  .wfield{margin-bottom:14px;}
  .wfield label{display:block;font-size:14px;color:var(--dark);margin-bottom:6px;font-weight:600;}
  .wfield input,.wfield select,.wfield textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
  .wrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:14px;}
  .wrow:last-child{border-bottom:none;}
  .wrow .k{color:var(--muted);}
  .wrow .v{color:var(--dark);font-weight:500;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">家床派单系统 <span>· 高保真原型</span></div>
  <div class="switch">
    <button id="e-user" class="active" onclick="setEnd('user')">用户端</button>
    <button id="e-nurse" onclick="setEnd('nurse')">护理端</button>
    <button id="e-admin" onclick="setEnd('admin')">平台端</button>
  </div>
</div>

<div id="app"></div>
<div class="overlay" id="ov"></div>

<script>
// ============ 统一假数据（虚构，不含真实人名与地址） ============
const MOCK = {
  patient:'陈美娟', patientMeta:'女 ｜ 68 岁 ｜ 失能 2 级',
  phone:'138 0000 0000',
  addr:'苏州市示例区示范路 18 号 阳光家园 2 栋 601',
  org:'苏康养家床服务中心',
  nurse:'林晓静', nurseTitle:'高级护理员 · 从业 5 年',
};

const S = {
  end:'user', user:null, page:'login', filter:'全部', orderTab:'服务订单', cancelReason:'',
  orders:[
    { id:1, no:'8800000001', svc:'生活照料', price:99, transport:30, status:'待确认',
      patient:MOCK.patient, phone:MOCK.phone, addr:MOCK.addr, time:'2025-10-10 14:00-15:00',
      note:'按照护计划上门服务，费用可用长护险 / 补贴抵扣（演示）。', caregiver:'', site:MOCK.org,
      createTime:'2025-08-08 10:30:56', payTime:'2025-08-08 10:30:56', payMethod:'微信支付',
      checkin:'', checkout:'', tasks:{identity:false,diagnosis:false,assess:false,record:false}, assess:null, record:null },
    { id:2, no:'8800000002', svc:'助浴服务', price:89, transport:30, status:'待服务',
      patient:MOCK.patient, phone:MOCK.phone, addr:MOCK.addr, time:'2025-10-12 10:00-11:00',
      note:'', caregiver:MOCK.nurse, caregiverTitle:MOCK.nurseTitle, site:MOCK.org,
      createTime:'2025-08-08 10:30:56', payTime:'2025-08-08 10:31:05', payMethod:'微信支付',
      checkin:'', checkout:'', tasks:{identity:false,diagnosis:false,assess:false,record:false}, assess:null, record:null },
    { id:3, no:'8800000003', svc:'陪同就医', price:99, transport:30, status:'已完成',
      patient:MOCK.patient, phone:MOCK.phone, addr:MOCK.addr, time:'2025-10-08 10:00-11:00',
      note:'', caregiver:MOCK.nurse, caregiverTitle:MOCK.nurseTitle, site:MOCK.org,
      createTime:'2025-10-05 09:00:00', payTime:'2025-10-05 09:01:00', payMethod:'微信支付',
      checkin:'10:02', checkout:'10:58', tasks:{identity:true,diagnosis:true,assess:true,record:true}, assess:{}, record:{content:'生活照料完成，老人状态良好'} },
    { id:4, no:'8800000004', svc:'康复训练', price:150, transport:30, status:'退款中',
      patient:MOCK.patient, phone:MOCK.phone, addr:MOCK.addr, time:'2025-10-13 09:00-10:00',
      note:'', caregiver:'', site:MOCK.org,
      createTime:'2025-10-06 09:00:00', payTime:'2025-10-06 09:01:00', payMethod:'微信支付',
      checkin:'', checkout:'', tasks:{identity:false,diagnosis:false,assess:false,record:false}, assess:null, record:null },
  ],
  services:[
    {name:'生活照料', price:99, desc:'护理员上门提供起居照料、清洁、陪护'},
    {name:'助浴服务', price:150, desc:'护理员上门协助老人沐浴、清洁'},
    {name:'康复训练', price:120, desc:'协助肢体功能康复训练'},
    {name:'陪同就医', price:100, desc:'陪诊、代取药、就医协助'},
    {name:'健康监测', price:80, desc:'血压、血糖等体征监测与记录'},
  ],
  reasons:['用户计划有变，不需要了','用户预约信息填写错','用户服务项目变化','用户身体状况不佳','用户不在家','平台派单错误','护理员临时有事无法服务','极端天气','护理员身体状况不佳','其他原因'],
};
const $ = id => document.getElementById(id);
const app = () => $('app');
const ov = () => $('ov');
const order = () => S.orders.find(o=>o.id===S.cur);
function tag(st){const m={'待支付':'orange','待确认':'blue','待服务':'orange','已完成':'green','已取消':'gray','退款中':'red','已退款':'gray'};return `<span class="tag ${m[st]||'gray'}">${st}</span>`;}
function closeOv(){ ov().className='overlay'; }
function sheet(title, body, foot){
  ov().innerHTML = `<div class="sheet"><button class="x" onclick="closeOv()">✕</button><div class="head">${title}</div>${body}<div class="foot">${foot}</div></div>`;
  ov().className='overlay show';
}
function dialog(title, body, foot){
  ov().innerHTML = `<div class="dialog"><button class="x" onclick="closeOv()">✕</button><div class="head">${title}</div>${body}<div class="foot">${foot}</div></div>`;
  ov().className='overlay show center';
}
function webModal(title, body, foot){
  ov().innerHTML = `<div class="wmodal"><div class="wm-head"><span>${title}</span><button class="wm-x" onclick="closeOv()">✕</button></div><div class="wm-body">${body}</div><div class="wm-foot">${foot}</div></div>`;
  ov().className='overlay show center';
}

function setEnd(e){
  S.end=e;
  S.page = e==='user' ? (S.user?'home':'login') : (e==='nurse'?'nurseList':'adminOrders');
  ['user','nurse','admin'].forEach(x=>$('e-'+x).classList.toggle('active',x===e));
  render();
}
function render(){
  if(S.end==='user') return renderUser();
  if(S.end==='nurse') return renderNurse();
  return renderAdmin();
}

// ================= 用户端 =================
function renderUser(){
  if(S.page==='login'){
    app().innerHTML=`<div class="phone">
      <div class="grad" style="padding:46px 24px 64px;color:#fff;text-align:center;">
        <div style="width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.25);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:34px;">✚</div>
        <div style="font-size:18px;">您好，欢迎使用家床派单系统！</div>
      </div>
      <div style="background:#fff;border-radius:16px;margin:-36px 16px 0;padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.08);">
        <div style="font-size:22px;font-weight:800;color:var(--dark);margin-bottom:16px;">验证码登录</div>
        <div class="field"><label>手机号</label><input id="lg-phone" value="${MOCK.phone}"></div>
        <div class="field"><label>验证码</label><div style="display:flex;gap:8px;"><input id="lg-code" placeholder="请输入验证码" style="flex:1;background:#f9fafb;"><button class="btn sm" style="background:#fff2e8;color:var(--primary);border-radius:10px;" onclick="alert('验证码已发送（演示：1234）')">获取验证码</button></div></div>
        <button class="btn full" style="margin-top:6px;" onclick="userLogin()">登录</button>
      </div>
      <div style="text-align:center;color:var(--muted);font-size:13px;margin-top:20px;">苏康养 · 家庭养老床位服务</div>
    </div>`;
  }
  else if(S.page==='home'){
    app().innerHTML=`<div class="phone"><div class="nav">家床派单系统</div>
      <div class="body">
        <div class="hero"><div class="big">苏康养<br>让专业照护走进千万家</div><div class="sub">家庭养老床位 · 示范服务</div></div>
        <div class="card"><div style="font-weight:700;color:var(--dark);margin-bottom:10px;">服务流程</div>
          <div class="flow"><span class="step">① 预约服务</span><span class="arrow">→</span><span class="step">② 填写信息</span><span class="arrow">→</span><span class="step">③ 完成支付</span><span class="arrow">→</span><span class="step">④ 平台确认</span><span class="arrow">→</span><span class="step">⑤ 护理员上门</span><span class="arrow">→</span><span class="step">⑥ 服务完成</span></div>
        </div>
        <div style="font-weight:700;color:var(--dark);margin:6px 0 10px;">服务项目</div>
        ${S.services.map((s,i)=>`<div class="svc" onclick="pickService(${i})"><div class="thumb"></div><div><div class="t">${s.name}</div><div class="d">${s.desc}</div></div><div class="p">¥${s.price}<span style="font-size:12px;color:var(--muted);"> 起/次</span></div></div>`).join('')}
      </div>
      <div class="bottombar"><button class="btn line" style="flex:0 0 76px;" onclick="S.page='profile';render()">我的</button><button class="btn" onclick="pickService(0)">预约服务</button></div>
    </div>`;
  }
  else if(S.page==='booking'){
    const s=S.draft;
    app().innerHTML=`<div class="phone"><div class="nav"><button class="back" onclick="S.page='home';render()">‹</button>预约结算</div>
      <div class="body">
        <div class="card">
          <div class="row"><span class="k">服务项目</span><span class="v">${s.name} <span style="color:var(--primary);">¥${s.price}</span></span></div>
          <div class="field" style="margin-top:10px;"><label>服务对象</label><input id="bk-patient" value="${MOCK.patient}"></div>
          <div class="field"><label>联系电话</label><input id="bk-phone" value="${MOCK.phone}"></div>
          <div class="field"><label>服务地址</label><input id="bk-addr" value="${MOCK.addr}"></div>
          <div class="field"><label>预约时间</label><select id="bk-time"><option>2025-10-13 14:00-15:00</option><option>2025-10-13 15:00-16:00</option><option>2025-10-14 09:00-10:00</option></select></div>
          <div class="field"><label>备注</label><textarea id="bk-note" placeholder="补充说明（可选）"></textarea></div>
        </div>
        <div class="card"><div class="row"><span class="k">服务费用</span><span class="v">¥${s.price}.00</span></div><div class="row"><span class="k">交通费用</span><span class="v">¥30.00</span></div><div class="row"><span class="k">合计</span><span class="v" style="color:var(--primary);font-size:18px;">¥${s.price+30}.00</span></div></div>
      </div>
      <div class="bottombar"><button class="btn" onclick="submitBooking()">提交订单</button></div>
    </div>`;
  }
  else if(S.page==='payResult'){
    app().innerHTML=`<div class="phone"><div class="nav">支付结果</div>
      <div class="body" style="text-align:center;padding-top:56px;">

function aSchedule(){

  html+=`<th style="background:#f3f4f6;padding:10px;font-size:13px;color:var(--dark);border:1px solid var(--border);width:86px;">护理员</th>`;
  WEEK.forEach(w=>html+=`<th style="background:#f3f4f6;padding:10px;font-size:13px;color:var(--dark);border:1px solid var(--border);">${w[0]}<br><span style="font-weight:400;color:var(--muted);">${w[1]}</span></th>`);

  NURSES.forEach(n=>{
    html+=`<tr><td style="padding:10px;border:1px solid var(--border);font-weight:600;color:var(--dark);">${n.name}</td>`;

let REFUND_RULES=[
  {cond:'预约时间前一天', pct:0},
  {cond:'距离订单开始时间 ≥2 小时', pct:0},
  {cond:'距离订单开始时间 ≤2 小时', pct:30},
  {cond:'护理员已上门', pct:50, extra:'+ 交通费'},
];
function aRefundRules(){
  const rows=REFUND_RULES.map((r,i)=>[r.cond, r.pct===0?'不扣费':('扣服务费的 '+r.pct+'%'+(r.extra||'')), `<button class="wbtn line sm" onclick="editRefundRule(${i})">编辑</button>`]);
  return h1('退款规则配置','配置用户取消订单时的扣费比例')+
    adminTable(['取消场景','扣费规则','操作'],rows)+
    `<div style="background:#fff8f3;border:1px solid #fed7aa;border-radius:12px;padding:12px 14px;color:var(--primary);font-size:14px;margin-top:14px;max-width:640px;">规则由平台维护，用户端「取消预约」页展示的退款金额与扣费说明，按这里的配置实时计算。</div>`;
}
function editRefundRule(i){
  const r=REFUND_RULES[i];
  webModal('编辑扣费比例',
    `<div class="wfield"><label>取消场景</label><input value="${r.cond}" disabled style="background:#f9fafb;color:var(--muted);"></div>
     <div class="wfield"><label>扣服务费比例（%）</label><input id="rr-pct" type="number" value="${r.pct}"></div>`,
    `<button class="wbtn line" onclick="closeOv()">取消</button><button class="wbtn" onclick="saveRefundRule(${i})">保存</button>`);
}
function saveRefundRule(i){ REFUND_RULES[i].pct=+$('rr-pct').value; closeOv(); render(); }

setEnd('user');
</script>
</body>
</html>
